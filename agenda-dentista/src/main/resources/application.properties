spring.application.name=agenda-dentista

# Configurações do Banco de Dados H2
spring.datasource.url=jdbc:h2:mem:agendadb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Habilitar o console do H2 no navegador (útil para testes)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Atualiza as tabelas automaticamente baseado no seu código Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Troca a porta padrão para 8081
server.port=8081

# Configurações do Banco de Dados PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/agenda_dentista
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# Cria ou atualiza as tabelas automaticamente e não apaga os dados ao reiniciar
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect